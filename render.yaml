services:
  - type: web
    name: atc-manager-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: INTERNAL_API_SECRET
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
